<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Lookup</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .font-display { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; letter-spacing: -0.01em; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 3px; }
  .nav-item { color: #6b7280; }
  .nav-item.active { color: #ef4444; background: #fef2f2; }
  .nav-item svg { stroke: currentColor; }
  main h1, main h2, .font-display { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; letter-spacing: -0.01em; }
  @media (max-width: 767px) {
    #sidebar { position: fixed; inset: 0; z-index: 50; width: 100% !important; transform: translateX(-100%); transition: transform .25s ease; }
    #sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body class="bg-white text-gray-900">
<div id="app"></div>

<script>
/* ---------- state ----------
   One object, one render(). Every action ends by calling setState,
   nothing else touches the DOM. */
const API = '/api';
const state = {
  token: localStorage.getItem('token') || null,
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  viewRole: null,          // frontend-only override — lets the real admin preview other roles
  route: 'home',
  authMode: 'login',
  menuOpen: false,
  notifOpen: false,
  data: {},
  error: null,
  loading: false
};

function setState(patch) { Object.assign(state, patch); render(); }

// The role that actually gates what's rendered — real role, unless the
// logged-in admin has switched the view for themselves. Reflected in the URL
// as ?role= so a switched view survives refresh/share, same as the route.
function effectiveRole() {
  if (state.user?.role === 'Admin' && state.viewRole) return state.viewRole;
  return state.user?.role || null;
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  let body = {};
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

function loginSuccess(token, user) {
  localStorage.setItem('token', token);
  localStorage.setItem('user', JSON.stringify(user));
  state.token = token; state.user = user; state.error = null;
  if (location.hash === '#/home') navigate(); else location.hash = '#/home';
}
function logout() {
  localStorage.removeItem('token'); localStorage.removeItem('user');
  state.token = null; state.user = null; state.viewRole = null; state.data = {};
  if (location.hash === '#/home') navigate(); else location.hash = '#/home';
}

/* ---------- hash routing ----------
   Hash is the single source of truth for both the visible section and the
   admin's view-role override: #/tickets, #/admin?role=Staff. Reading state
   back out of the hash means refresh, back/forward, and shared links all work. */
const ROUTES = {
  home: { endpoints: ['tickets', 'faqs', 'announcements'] },
  tickets: { endpoints: ['tickets'] },
  bookings: { endpoints: ['bookings', 'items'] },
  equipment: { endpoints: ['items'] },
  faqs: { endpoints: ['faqs'] },
  announcements: { endpoints: ['announcements'] },
  notifications: { endpoints: ['notifications'] },
  admin: { endpoints: ['users', 'stats', 'tickets'] },
  profile: { endpoints: [] }
};
const ENDPOINT_PATH = {
  tickets: '/tickets', bookings: '/bookings', items: '/items', faqs: '/faqs',
  announcements: '/announcements', notifications: '/notifications', users: '/admin/users', stats: '/admin/stats'
};

function parseHash() {
  const raw = location.hash.slice(2) || 'home';           // strip '#/'
  const [route, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  return { route: ROUTES[route] ? route : 'home', role: params.get('role') };
}

function navigate() {
  const { route, role } = parseHash();
  state.route = route;
  state.viewRole = (state.user?.role === 'Admin' && role) ? role : null;
  state.menuOpen = false;
  render();
  loadRoute(route);
}
window.addEventListener('hashchange', navigate);

async function loadRoute(name) {
  const def = ROUTES[name];
  if (!def || !state.user) return;
  state.loading = true; render();
  try {
    const results = await Promise.all(def.endpoints.map(k => api(ENDPOINT_PATH[k])));
    def.endpoints.forEach((k, i) => { state.data[k] = results[i]; });
    state.error = null;
  } catch (e) { state.error = e.message; }
  state.loading = false;
  render();
}
function go(route) {
  // Role-preview persists across navigation until the admin explicitly exits it —
  // dropping it silently on every click made "view as" feel broken/one-shot.
  const qs = state.viewRole ? `?role=${state.viewRole}` : '';
  location.hash = `#/${route}${qs}`;
}
function setViewRole(role) {
  const target = role || null;
  const qs = target ? `?role=${target}` : '';
  location.hash = `#/${state.route}${qs}`;
}

/* ---------- icons (outline, 1.5px stroke, no fill) ---------- */
const ICONS = {
  home: `<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>`,
  ticket: `<path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a1.5 1.5 0 0 0 0 3V15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a1.5 1.5 0 0 0 0-3z"/><path d="M9 7v10" stroke-dasharray="2 2"/>`,
  booking: `<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>`,
  equipment: `<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/>`,
  faq: `<circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.1.9-1.1 1.8"/><circle cx="12" cy="16.5" r=".4" fill="currentColor" stroke="none"/>`,
  announcement: `<path d="M4 10v4a1 1 0 0 0 1 1h2l7 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M17 9.5a3 3 0 0 1 0 5"/>`,
  admin: `<path d="M12 3l7 3v5c0 4.5-2.9 7.9-7 10-4.1-2.1-7-5.5-7-10V6z"/>`,
  bell: `<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>`,
  menu: `<path d="M4 7h16M4 12h16M4 17h16"/>`,
  close: `<path d="M6 6l12 12M18 6L6 18"/>`,
  chevron: `<path d="M9 6l6 6-6 6"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`
};
function icon(name, cls = 'w-5 h-5') {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function fmtDate(d) { const dt = new Date(d); return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }

// Logo mark — a headset/support glyph in a rounded square, reads as "help desk"
// at a glance rather than a generic abstract shape.
function logoMark(size = 32) {
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none">
    <rect width="32" height="32" rx="9" fill="#ef4444"/>
    <path d="M9 17v-2a7 7 0 0 1 14 0v2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="7.5" y="16" width="4" height="6" rx="2" fill="white"/>
    <rect x="20.5" y="16" width="4" height="6" rx="2" fill="white"/>
    <path d="M23 22.5v.5a3 3 0 0 1-3 3h-2.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  </svg>`;
}
function logoLockup(size = 28) {
  return `<span class="flex items-center gap-2">${logoMark(size)}<span class="font-display font-bold text-lg"><span class="text-gray-900">ICT</span> <span class="font-medium text-gray-400">Lookup</span></span></span>`;
}

const STATUS_COLOR = {
  Pending: 'bg-amber-50 text-amber-700', Maintenance: 'bg-amber-50 text-amber-700',
  Assigned: 'bg-blue-50 text-blue-700', 'In Progress': 'bg-blue-50 text-blue-700',
  Resolved: 'bg-emerald-50 text-emerald-700', Approved: 'bg-emerald-50 text-emerald-700', Available: 'bg-emerald-50 text-emerald-700',
  Closed: 'bg-gray-100 text-gray-600', Cancelled: 'bg-gray-100 text-gray-600', Retired: 'bg-gray-100 text-gray-600',
  Rejected: 'bg-red-50 text-red-700'
};
function pill(status) { return `<span class="text-[11px] font-semibold px-2.5 py-1 rounded-full ${STATUS_COLOR[status] || 'bg-gray-100 text-gray-600'}">${status}</span>`; }

/* ---------- sidebar ---------- */
function navItems() {
  const role = effectiveRole();
  const items = [['home', 'Home', 'home'], ['tickets', 'Tickets', 'ticket'], ['bookings', 'Bookings', 'booking'], ['equipment', 'Equipment', 'equipment'], ['faqs', 'FAQs', 'faq']];
  if (role !== 'User') items.push(['announcements', 'Announcements', 'announcement']);
  if (role === 'Admin') items.push(['admin', 'Admin', 'admin']);
  return items;
}

function sidebar() {
  const role = effectiveRole();
  const isRealAdmin = state.user?.role === 'Admin';
  return `
  <aside id="sidebar" class="${state.menuOpen ? 'open' : ''} w-72 md:w-64 bg-white border-r border-gray-100 flex-shrink-0 flex flex-col h-full">
    <div class="flex items-center justify-between px-5 h-16 border-b border-gray-100 md:hidden">
      ${logoLockup(30)}
      <button onclick="setState({menuOpen:false})" class="p-2 -mr-2 text-gray-400">${icon('close')}</button>
    </div>
    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
      ${navItems().map(([id, label, ic]) => `
        <button onclick="go('${id}')" class="nav-item ${state.route === id ? 'active' : ''} w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition">
          ${icon(ic)}${label}
        </button>`).join('')}
    </nav>
    ${isRealAdmin ? `
    <div class="mx-3 mb-3 p-3 rounded-xl bg-gray-50 border border-gray-100">
      <div class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mb-2">View as</div>
      <div class="flex gap-1">
        ${['Admin', 'Staff', 'User'].map(r => `
          <button onclick="setViewRole('${r}'==='${state.user.role}'?null:'${r}')"
            class="flex-1 text-xs font-medium py-1.5 rounded-lg ${role === r ? 'bg-gray-900 text-white' : 'text-gray-500 hover:bg-gray-100'}">${r}</button>`).join('')}
      </div>
    </div>` : ''}
    <button onclick="go('profile')" class="flex items-center gap-3 px-5 py-4 border-t border-gray-100 text-left">
      <div class="w-9 h-9 rounded-full bg-gray-900 text-white flex items-center justify-center text-sm font-semibold flex-shrink-0">
        ${state.user ? esc(state.user.name[0].toUpperCase()) : '?'}
      </div>
      <div class="min-w-0 flex-1">
        <div class="text-sm font-medium truncate">${state.user ? esc(state.user.name) : 'Guest'}</div>
        <div class="text-xs text-gray-400">${role || 'Signed out'}</div>
      </div>
      ${icon('chevron', 'w-4 h-4 text-gray-300')}
    </button>
  </aside>
  ${state.menuOpen ? `<div onclick="setState({menuOpen:false})" class="fixed inset-0 bg-black/30 z-40 md:hidden"></div>` : ''}`;
}

/* ---------- header ---------- */
function topbar() {
  const unread = (state.data.notifications || []).some(n => !n.is_read);
  return `
  <header class="h-16 flex items-center justify-between px-4 md:px-6 border-b border-gray-100 flex-shrink-0 relative">
    <div class="flex items-center gap-3">
      <button onclick="setState({menuOpen:true})" class="md:hidden p-2 -ml-2 text-gray-700">${icon('menu')}</button>
      ${logoLockup(26)}
    </div>
    <button onclick="toggleNotifications(event)" class="relative p-2 rounded-full hover:bg-gray-50 text-gray-500">
      ${icon('bell')}
      ${unread ? `<span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-red-500"></span>` : ''}
    </button>
    ${state.notifOpen ? notificationsPanel() : ''}
  </header>`;
}

function notificationsPanel() {
  const list = state.data.notifications || [];
  return `
  <div id="notif-panel" class="absolute top-14 right-4 md:right-6 w-80 max-w-[calc(100vw-2rem)] bg-white border border-gray-100 rounded-2xl shadow-xl z-30 max-h-96 overflow-y-auto">
    <div class="px-4 py-3 border-b border-gray-100 font-semibold text-sm">Notifications</div>
    <div class="p-2">
      ${list.length ? list.map(n => `
        <div class="flex justify-between items-center gap-2 px-3 py-2.5 rounded-xl ${n.is_read ? 'opacity-50' : 'hover:bg-gray-50'}">
          <span class="text-sm">${esc(n.message)}</span>
          ${!n.is_read ? `<button onclick="markRead(${n.id})" class="text-[11px] text-red-600 underline whitespace-nowrap flex-shrink-0">Mark read</button>` : ''}
        </div>`).join('') : `<div class="px-3 py-8 text-center text-sm text-gray-400">No notifications yet</div>`}
    </div>
  </div>`;
}

let notifLoaded = false;
async function toggleNotifications(e) {
  e.stopPropagation();
  if (!state.notifOpen && !notifLoaded) {
    try { state.data.notifications = await api('/notifications'); notifLoaded = true; } catch (_) {}
  }
  setState({ notifOpen: !state.notifOpen });
}
document.addEventListener('click', (e) => {
  if (state.notifOpen && !e.target.closest('#notif-panel')) setState({ notifOpen: false });
});

/* ---------- views ---------- */

function homeView() {
  const role = effectiveRole();
  const tickets = (state.data.tickets || []).slice(0, 4);
  const myTickets = tickets;
  const openCount = (state.data.tickets || []).filter(t => !['Resolved', 'Closed'].includes(t.status)).length;
  const resolvedCount = (state.data.tickets || []).filter(t => ['Resolved', 'Closed'].includes(t.status)).length;
  const latestAnnouncement = (state.data.announcements || [])[0];

  return `
  <div class="px-4 md:px-6 py-6 max-w-2xl mx-auto">
    <div class="bg-gradient-to-br from-red-500 to-red-600 rounded-3xl px-6 py-8 text-center text-white mb-5">
      <h1 class="text-2xl font-extrabold tracking-tight mb-1">SEAMLESS SUPPORT SERVICE</h1>
      <p class="text-sm text-red-100">Open a ticket and now</p>
    </div>

    ${latestAnnouncement ? `
    <button onclick="go('announcements')" class="w-full flex items-start gap-3 bg-amber-50 border border-amber-100 rounded-2xl px-4 py-3 mb-5 text-left">
      <span class="text-amber-500 mt-0.5 flex-shrink-0">${icon('announcement', 'w-4 h-4')}</span>
      <div class="min-w-0">
        <div class="text-xs font-semibold text-amber-800">${esc(latestAnnouncement.title)}</div>
        <div class="text-xs text-amber-600 truncate">${esc(latestAnnouncement.body)}</div>
      </div>
    </button>` : ''}

    <div class="grid grid-cols-2 gap-3 mb-8">
      <div class="border border-gray-100 rounded-2xl px-4 py-3.5">
        <div class="text-2xl font-bold">${openCount}</div>
        <div class="text-xs text-gray-400">Open tickets</div>
      </div>
      <div class="border border-gray-100 rounded-2xl px-4 py-3.5">
        <div class="text-2xl font-bold">${resolvedCount}</div>
        <div class="text-xs text-gray-400">Resolved</div>
      </div>
    </div>

    <h2 class="text-lg font-bold mb-3">Create</h2>
    <div class="grid grid-cols-3 gap-3 mb-8">
      <button onclick="openCreate('ticket')" class="aspect-square border border-gray-200 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-gray-900 hover:bg-gray-50 transition">
        ${icon('ticket', 'w-6 h-6 text-gray-700')}<span class="text-xs font-medium text-gray-600">Ticket</span>
      </button>
      <button onclick="openCreate('booking')" class="aspect-square border border-gray-200 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-gray-900 hover:bg-gray-50 transition">
        ${icon('booking', 'w-6 h-6 text-gray-700')}<span class="text-xs font-medium text-gray-600">Booking</span>
      </button>
      <div class="aspect-square border border-gray-200 rounded-2xl flex flex-col items-center justify-center gap-1.5 px-1">
        ${icon('faq', 'w-6 h-6 text-gray-700')}
        <span class="text-xs font-medium text-gray-600 mb-0.5">FAQ</span>
        <div class="flex items-center gap-2 text-[11px]">
          ${role === 'Admin' ? `<button onclick="openCreate('faq')" class="font-semibold text-red-600">New</button><span class="text-gray-200">|</span>` : ''}
          <button onclick="go('faqs')" class="text-gray-400 underline">View</button>
        </div>
      </div>
    </div>

    <h2 class="text-lg font-bold mb-3">Support Tickets</h2>
    <div class="space-y-3">
      ${myTickets.length ? myTickets.map(ticketRow).join('') : emptyRow('No tickets yet')}
    </div>
  </div>`;
}

function emptyRow(msg) { return `<div class="border border-gray-100 rounded-2xl px-4 py-8 text-center text-sm text-gray-400">${msg}</div>`; }

function ticketRow(t) {
  return `
  <div class="border border-gray-100 rounded-2xl px-4 py-3.5">
    <div class="flex justify-between items-start gap-2 mb-1">
      <div class="font-medium text-sm">${esc(t.category)}</div>
      ${pill(t.status)}
    </div>
    <p class="text-sm text-gray-500 line-clamp-1">${esc(t.description)}</p>
  </div>`;
}

function ticketsView() {
  const role = effectiveRole();
  const tickets = state.data.tickets || [];
  const nextMap = { Pending: 'Assigned', Assigned: 'In Progress', 'In Progress': 'Resolved', Resolved: 'Closed' };
  return `
  <div class="px-4 md:px-6 py-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-xl font-bold">Tickets</h1>
      <button onclick="openCreate('ticket')" class="flex items-center gap-1.5 bg-gray-900 text-white text-sm font-medium px-3.5 py-2 rounded-xl">${icon('plus', 'w-4 h-4')}New</button>
    </div>
    <div class="space-y-3">
      ${tickets.length ? tickets.map(t => `
        <div class="border border-gray-100 rounded-2xl px-4 py-4">
          <div class="flex justify-between items-start gap-2 mb-1">
            <div class="font-medium text-sm">${esc(t.category)}</div>${pill(t.status)}
          </div>
          <p class="text-sm text-gray-500 mb-2">${esc(t.description)}</p>
          <div class="text-xs text-gray-400 mb-3">#${t.id} · ${t.priority} priority${t.assignee_name ? ' · ' + esc(t.assignee_name) : ''}</div>
          ${role !== 'User' ? `<div class="flex gap-2">
            ${t.status === 'Pending' ? `<button onclick="ticketAction(${t.id},'assign')" class="text-xs border border-gray-200 rounded-full px-3 py-1.5 font-medium">Assign to me</button>` : ''}
            ${nextMap[t.status] ? `<button onclick="ticketAction(${t.id},'status','${nextMap[t.status]}')" class="text-xs bg-emerald-600 text-white rounded-full px-3 py-1.5 font-medium">Move to ${nextMap[t.status]}</button>` : ''}
          </div>` : ''}
        </div>`).join('') : emptyRow('No tickets yet')}
    </div>
  </div>`;
}
async function ticketAction(id, kind, status) {
  try {
    if (kind === 'assign') await api(`/tickets/${id}/assign`, { method: 'PATCH', body: JSON.stringify({ assigned_to: state.user.id }) });
    else await api(`/tickets/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
    await loadRoute('tickets');
  } catch (e) { setState({ error: e.message }); }
}

function bookingsView() {
  const role = effectiveRole();
  const bookings = state.data.bookings || [];
  return `
  <div class="px-4 md:px-6 py-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-xl font-bold">Bookings</h1>
      <button onclick="openCreate('booking')" class="flex items-center gap-1.5 bg-gray-900 text-white text-sm font-medium px-3.5 py-2 rounded-xl">${icon('plus', 'w-4 h-4')}New</button>
    </div>
    <div class="space-y-3">
      ${bookings.length ? bookings.map(b => `
        <div class="border border-gray-100 rounded-2xl px-4 py-4">
          <div class="flex justify-between items-start gap-2 mb-1">
            <div class="font-medium text-sm">${esc(b.item_name || 'Item #' + b.item_id)}</div>${pill(b.status)}
          </div>
          <div class="text-xs text-gray-400 mb-3">${fmtDate(b.start_time)} → ${fmtDate(b.end_time)}</div>
          <div class="flex gap-2">
            ${role !== 'User' && b.status === 'Pending' ? `
              <button onclick="bookingAction(${b.id},'approve')" class="text-xs bg-emerald-600 text-white rounded-full px-3 py-1.5 font-medium">Approve</button>
              <button onclick="bookingAction(${b.id},'reject')" class="text-xs border border-red-200 text-red-600 rounded-full px-3 py-1.5 font-medium">Reject</button>` : ''}
            ${['Pending', 'Approved'].includes(b.status) ? `<button onclick="bookingAction(${b.id},'cancel')" class="text-xs text-gray-400 underline">Cancel</button>` : ''}
          </div>
        </div>`).join('') : emptyRow('No bookings yet')}
    </div>
  </div>`;
}
async function bookingAction(id, action) {
  try { await api(`/bookings/${id}/${action}`, { method: 'PATCH' }); await loadRoute('bookings'); }
  catch (e) { setState({ error: e.message }); }
}

function equipmentView() {
  const role = effectiveRole();
  const items = state.data.items || [];
  return `
  <div class="px-4 md:px-6 py-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-xl font-bold">Equipment & Rooms</h1>
      ${role === 'Admin' ? `<button onclick="openCreate('item')" class="flex items-center gap-1.5 bg-gray-900 text-white text-sm font-medium px-3.5 py-2 rounded-xl">${icon('plus', 'w-4 h-4')}Add</button>` : ''}
    </div>
    <div class="grid grid-cols-2 gap-3">
      ${items.length ? items.map(i => `
        <div class="border border-gray-100 rounded-2xl p-4">
          <div class="font-medium text-sm mb-0.5">${esc(i.name)}</div>

}
async function itemStatus(id, status) {

      ${role === 'Admin' ? `<button onclick="openCreate('announcement')" class="flex items-center gap-1.5 bg-gray-900 text-white text-sm font-medium px-3.5 py-2 rounded-xl">${icon('plus', 'w-4 h-4')}New</button>` : ''}

function notificationsView() {

  <div class="px-4 md:px-6 py-6 max-w-2xl mx-auto">
    <h1 class="text-xl font-bold mb-5">Notifications</h1>
    <div class="space-y-2">
      ${list.length ? list.map(n => `

async function markRead(id) { try { await api(`/notifications/${id}/read`, { method: 'PATCH' }); await loadRoute('notifications'); } catch (_) {} }

function adminView() {
  const role = effectiveRole();
  if (role !== 'Admin') return `<div class="px-4 md:px-6 py-16 text-center text-sm text-gray-400">Admin access required.</div>`;
  const s = state.data.stats || {};
  const users = state.data.users || [];
  const recentTickets = (state.data.tickets || []).slice(0, 3);
  return `
  <div class="px-4 md:px-6 py-6 max-w-2xl mx-auto">
    <h1 class="text-xl font-bold mb-5">Admin</h1>
    <div class="grid grid-cols-3 gap-3 mb-6">
      ${[['total_users', 'Users'], ['total_tickets', 'Tickets'], ['total_bookings', 'Bookings']].map(([k, label]) => `
        <div class="border border-gray-100 rounded-2xl py-4 text-center">
          <div class="text-2xl font-bold">${s[k] ?? '—'}</div><div class="text-xs text-gray-400">${label}</div>

    ${recentTickets.length ? `
    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wide mb-3">Recent activity</h2>
    <div class="space-y-2 mb-8">
      ${recentTickets.map(t => `
        <div class="flex items-center justify-between border border-gray-100 rounded-xl px-4 py-2.5">
          <span class="text-sm text-gray-600 truncate">${esc(t.category)}</span>
          ${pill(t.status)}
        </div>`).join('')}
    </div>` : ''}

    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wide mb-3">Users</h2>
    <div class="space-y-2">
      ${users.map(u => `
        <div class="flex items-center justify-between border border-gray-100 rounded-2xl px-4 py-3">
          <div><div class="text-sm font-medium">${esc(u.name)}</div><div class="text-xs text-gray-400">${esc(u.email)}</div></div>
          <select onchange="changeRole(${u.id},this.value)" class="text-xs border border-gray-200 rounded-full px-2 py-1">
            ${['User', 'Staff', 'Admin'].map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>
  </div>`;
}
async function changeRole(id, role) {
  try { await api(`/admin/users/${id}/role`, { method: 'PATCH', body: JSON.stringify({ role }) }); await loadRoute('admin'); }
  catch (e) { setState({ error: e.message }); }
}

function profileView() {
  const u = state.user;
  return `
  <div class="px-4 md:px-6 py-6 max-w-md mx-auto text-center">
    <div class="w-20 h-20 rounded-full bg-gray-900 text-white flex items-center justify-center text-2xl font-semibold mx-auto mb-4">
      ${esc(u.name[0].toUpperCase())}
    </div>
    <h1 class="text-lg font-bold">${esc(u.name)}</h1>
    <p class="text-sm text-gray-400 mb-6">${esc(u.email)} · ${u.role}</p>
    <button onclick="logout()" class="text-sm font-medium text-red-600 border border-red-200 rounded-xl px-5 py-2.5">Sign out</button>
  </div>`;
}

function authView() {
  const mode = state.authMode || 'login';
  const isLogin = mode === 'login';
  return `
  <div class="min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8 flex justify-center">
        ${logoLockup(36)}
      </div>

      <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
        <button onclick="setState({authMode:'login',error:null})" class="flex-1 text-sm font-medium py-2 rounded-lg transition ${isLogin ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}">Sign in</button>
        <button onclick="setState({authMode:'signup',error:null})" class="flex-1 text-sm font-medium py-2 rounded-lg transition ${!isLogin ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}">Sign up</button>
      </div>

      ${state.error ? `<div class="bg-red-50 text-red-600 text-sm rounded-xl px-3 py-2 mb-4">${esc(state.error)}</div>` : ''}

      ${isLogin ? `
      <form id="login-form" class="space-y-3">
        <input required name="email" type="email" placeholder="Email" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
        <input required name="password" type="password" placeholder="Password" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
        <button class="w-full bg-gray-900 text-white rounded-xl py-3 text-sm font-medium">Sign in</button>
      </form>` : `
      <form id="signup-form" class="space-y-3">
        <input required name="name" placeholder="Full name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
        <input required name="email" type="email" placeholder="Email" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
        <input required name="password" type="password" minlength="6" placeholder="Password (min. 6 characters)" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
        <button class="w-full bg-gray-900 text-white rounded-xl py-3 text-sm font-medium">Create account</button>
      </form>`}
    </div>
  </div>`;
}
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'login-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: f.get('email'), password: f.get('password') }) });
      loginSuccess(data.token, data.user);
    } catch (err) { setState({ error: err.message }); }
    return;
  }
  if (e.target.id === 'signup-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    const email = f.get('email'), password = f.get('password');
    try {
      // /auth/register only creates the account — sign in right after so the
      // person lands straight in the app instead of back at the login form.
      await api('/auth/register', { method: 'POST', body: JSON.stringify({ name: f.get('name'), email, password }) });
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      loginSuccess(data.token, data.user);
    } catch (err) { setState({ error: err.message }); }
  }
});

/* ---------- create sheet (full-screen on mobile, modal on desktop) ---------- */
const CREATE_FORMS = {
  ticket: {
    title: 'New ticket', endpoint: '/tickets', refresh: 'tickets',
    fields: `<input required name="category" placeholder="Category" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
      <textarea required name="description" placeholder="Describe the issue" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3"></textarea>
      <select name="priority" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
        <option value="Normal">Normal priority</option><option value="Low">Low</option><option value="High">High</option><option value="Urgent">Urgent</option>
      </select>`
  },
  booking: {
    title: 'New booking', endpoint: '/bookings', refresh: 'bookings',
    fields: () => `<select required name="item_id" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
        <option value="">Select item…</option>
        ${(state.data.items || []).filter(i => i.status === 'Available').map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('')}
      </select>
      <div class="flex gap-2 mb-3">
        <input required name="start_time" type="datetime-local" class="flex-1 border border-gray-200 rounded-xl px-3 py-3 text-sm">
        <input required name="end_time" type="datetime-local" class="flex-1 border border-gray-200 rounded-xl px-3 py-3 text-sm">
      </div>`,
    transform: b => { b.start_time = new Date(b.start_time).toISOString(); b.end_time = new Date(b.end_time).toISOString(); return b; }
  },
  faq: {
    title: 'New FAQ', endpoint: '/faqs', refresh: 'faqs',
    fields: `<input required name="question" placeholder="Question" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
      <textarea required name="answer" placeholder="Answer" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3"></textarea>`
  },
  announcement: {
    title: 'New announcement', endpoint: '/announcements', refresh: 'announcements',
    fields: `<input required name="title" placeholder="Title" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
      <textarea required name="body" placeholder="Message" rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3"></textarea>`
  },
  item: {
    title: 'Add equipment or room', endpoint: '/items', refresh: 'equipment',
    fields: `<input required name="name" placeholder="Name" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
      <select required name="type" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-3">
        <option value="Equipment">Equipment</option><option value="Room">Room</option>
      </select>`
  }
};
let openCreateKind = null;
function openCreate(kind) { openCreateKind = kind; renderCreateSheet(); }
function closeCreate() { openCreateKind = null; renderCreateSheet(); }
function renderCreateSheet() {
  const host = document.getElementById('create-sheet');
  if (!openCreateKind) { host.innerHTML = ''; return; }
  const cfg = CREATE_FORMS[openCreateKind];
  const fields = typeof cfg.fields === 'function' ? cfg.fields() : cfg.fields;
  host.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end md:items-center justify-center">
    <div onclick="closeCreate()" class="absolute inset-0 bg-black/30"></div>
    <div class="relative bg-white w-full h-full md:h-auto md:max-w-md md:rounded-3xl rounded-t-3xl p-6 overflow-y-auto">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-lg font-bold">${cfg.title}</h2>
        <button onclick="closeCreate()" class="p-1 text-gray-400">${icon('close')}</button>
      </div>
      <form id="create-form">${fields}<button class="w-full bg-gray-900 text-white rounded-xl py-3 text-sm font-medium mt-1">Submit</button></form>
    </div>
  </div>`;
  document.getElementById('create-form').onsubmit = async (e) => {
    e.preventDefault();
    let body = Object.fromEntries(new FormData(e.target));
    if (cfg.transform) body = cfg.transform(body);
    try { await api(cfg.endpoint, { method: 'POST', body: JSON.stringify(body) }); closeCreate(); await loadRoute(cfg.refresh); }
    catch (err) { setState({ error: err.message }); }
  };
}
async function deleteRecord(endpointKey, id, refresh) {
  try { await api(`${ENDPOINT_PATH[endpointKey]}/${id}`, { method: 'DELETE' }); await loadRoute(refresh); }
  catch (e) { setState({ error: e.message }); }
}

/* ---------- render ---------- */
const VIEW = {
  home: homeView, tickets: ticketsView, bookings: bookingsView, equipment: equipmentView,
  faqs: faqsView, announcements: announcementsView, notifications: notificationsView, admin: adminView, profile: profileView
};

function render() {
  const app = document.getElementById('app');
  if (!state.user) { app.innerHTML = authView(); return; }

  const body = state.loading && !Object.keys(state.data).length
    ? `<div class="px-6 py-16 text-center text-sm text-gray-400">Loading…</div>`
    : (VIEW[state.route] || homeView)();

  app.innerHTML = `
  <div class="flex h-screen overflow-hidden">
    ${sidebar()}
    <div class="flex-1 flex flex-col min-w-0">
      ${topbar()}
      <main class="flex-1 overflow-y-auto">
        ${state.error ? `<div class="max-w-2xl mx-auto px-4 md:px-6 pt-4"><div class="bg-red-50 text-red-600 text-sm rounded-xl px-3 py-2">${esc(state.error)}</div></div>` : ''}
        ${body}
      </main>
    </div>
  </div>
  <div id="create-sheet"></div>`;
  renderCreateSheet();
}

navigate();
</script>
