<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parish ICT Desk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 3px; }
  iframe.data { width: 100%; height: 100%; border: none; background: white; }
  @media (max-width: 768px) {
    .menu { position: fixed; inset: 0; z-index: 50; transform: translateX(-100%); transition: transform .3s ease; }
    .menu.open { transform: translateX(0); }
  }
</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased h-screen overflow-hidden">
  <div id="root" class="flex h-full">

    <!-- Sidebar -->
    <aside id="menu" class="menu w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
      <div class="p-4 border-b border-slate-700 flex items-center justify-between">
        <h1 class="text-lg font-bold tracking-wide">Parish ICT Desk</h1>
        <button id="closeMenuBtn" class="md:hidden text-slate-400 hover:text-white">
          <i class="fa fa-times"></i>
        </button>
      </div>
      <nav id="menuList" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
      <div id="userBox" class="p-3 border-t border-slate-700 text-xs text-slate-400"></div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-w-0">
      <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between gap-3 shadow-sm">
        <div class="flex items-center gap-3">
          <button id="openMenuBtn" class="md:hidden p-2 rounded-lg hover:bg-slate-100">
            <i class="fa fa-bars"></i>
          </button>
          <div>
            <h2 id="pageTitle" class="font-semibold text-lg">Select a section</h2>
            <p id="pageInfo" class="text-xs text-slate-500"></p>
          </div>
        </div>
        <button id="bellBtn" class="relative p-2 rounded-lg hover:bg-slate-100 text-slate-600" title="Notifications">
          <i class="fa fa-bell"></i>
          <span id="bellDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500"></span>
        </button>
      </header>

      <div id="content" class="flex-1 relative overflow-hidden">
        <iframe id="mainFrame" class="data absolute inset-0"
          srcdoc="<div style='padding:2rem;font-family:system-ui;color:#64748b'>Select a section from the menu.</div>">
        </iframe>
      </div>
    </main>

    <!-- Fullsheet -->
    <section id="fullSheet" class="fixed inset-0 z-50 bg-white flex flex-col hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 bg-slate-50">
        <h3 id="fullSheetTitle" class="font-semibold text-lg"></h3>
        <button id="closeFullSheetBtn" class="p-2 rounded-lg hover:bg-slate-200">
          <i class="fa fa-times text-lg"></i>
        </button>
      </div>
      <iframe id="fullFrame" class="data flex-1"></iframe>
    </section>
  </div>

<script>
  // ============================================
  // STATE — one object, one render(). Actions only call useState;
  // nothing outside render() touches the DOM directly.
  // ============================================
  let state = {
    token: localStorage.getItem('token') || null,
    user: JSON.parse(localStorage.getItem('user') || 'null'),
    activeTab: '',
    pageInfo: '',
    isMenuOpen: false,
    data: {},               // fetched records, keyed by endpoint name
    error: '',
    fullSheet: { active: false, title: '', content: null }
  };

  function useState(key, value) {
    if (arguments.length === 1) return state[key];
    state = typeof key === 'object' ? { ...state, ...key } : { ...state, [key]: value };
    render();
  }

  // ============================================
  // API
  // ============================================
  const API = '/api';
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (state.token) headers.Authorization = 'Bearer ' + state.token;
    const res = await fetch(API + path, { ...opts, headers });
    let body = {};
    try { body = await res.json(); } catch (_) { /* no body */ }
    if (!res.ok) throw new Error(body.error || 'Request failed');
    return body;
  }

  function loginSuccess(token, user) {
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    useState({ token, user, activeTab: 'home', error: '' });
  }
  function logout() {
    localStorage.removeItem('token'); localStorage.removeItem('user');
    useState({ token: null, user: null, activeTab: 'home', data: {} });
  }

  // ============================================
  // SECTIONS — each tab owns which endpoints feed it and how it renders.
  // Content is built as an HTML string and piped into the iframe, same as codes[].html.
  // ============================================
  const SECTIONS = {
    home:          { label: 'Home', icon: 'fa-house', auth: false, endpoints: [], build: buildHome },
    login:         { label: 'Sign in', icon: 'fa-right-to-bracket', auth: false, endpoints: [], build: buildAuth, hidden: true },
    help:          { label: 'Help', icon: 'fa-circle-question', auth: true, endpoints: ['faqs'], build: buildHelp },
    tickets:       { label: 'Tickets', icon: 'fa-ticket', auth: true, roles: ['Staff', 'Admin'], endpoints: ['tickets'], build: buildTickets },
    bookings:      { label: 'Bookings', icon: 'fa-calendar-check', auth: true, roles: ['Staff', 'Admin'], endpoints: ['bookings', 'items'], build: buildBookings },
    equipment:     { label: 'Equipment & Rooms', icon: 'fa-boxes-stacked', auth: true, roles: ['Staff', 'Admin'], endpoints: ['items'], build: buildEquipment },
    announcements: { label: 'Announcements', icon: 'fa-bullhorn', auth: true, roles: ['Staff', 'Admin'], endpoints: ['announcements'], build: buildAnnouncements },
    admin:         { label: 'Admin', icon: 'fa-user-shield', auth: true, roles: ['Admin'], endpoints: ['users', 'stats'], build: buildAdmin }
  };
  const ENDPOINT_PATH = {
    faqs: '/faqs', tickets: '/tickets', bookings: '/bookings', items: '/items',
    announcements: '/announcements', notifications: '/notifications', users: '/admin/users', stats: '/admin/stats'
  };

  function visibleTabs() {
    return Object.entries(SECTIONS).filter(([id, s]) => {
      if (s.hidden) return false;
      if (id === 'help') return true;
      if (id === 'home') return true;
      if (!state.user) return false;
      if (s.roles && !s.roles.includes(state.user.role)) return false;
      return true;
    });
  }

  // ============================================
  // LOAD — fetch only what the active tab needs, then hand off to its builder
  // ============================================
  async function loadTab(id, force = false) {
    const section = SECTIONS[id];
    if (!section) return;
    if (section.auth && !state.user) id = 'login';
    const active = SECTIONS[id];

    useState({ activeTab: id, pageInfo: 'Loading…', isMenuOpen: false, error: '' });

    try {
      if (active.endpoints.length) {
        const results = await Promise.all(active.endpoints.map(k =>
          force || !state.data[k] ? api(ENDPOINT_PATH[k]) : Promise.resolve(state.data[k])
        ));
        active.endpoints.forEach((k, i) => { state.data[k] = results[i]; });
      }
      applyFrame('mainFrame', active.build());
      useState('pageInfo', 'Ready');
    } catch (err) {
      applyFrame('mainFrame', `<div style="padding:2rem;font-family:system-ui;color:#ef4444">${err.message}</div>`);
      useState('pageInfo', 'Error');
    }
  }

  function refreshActive() { if (state.activeTab) loadTab(state.activeTab, true); }

  // ============================================
  // FRAME CONTENT — srcdoc only; each section is self-contained HTML with
  // inline styles, since Tailwind classes don't cross the iframe boundary.
  // ============================================
  function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
  function fmtDate(d) { const dt = new Date(d); return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + dt.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); }
  const STATUS_COLOR = {
    Pending: '#b45309', Maintenance: '#b45309', Assigned: '#1d4ed8', 'In Progress': '#1d4ed8',
    Resolved: '#15803d', Approved: '#15803d', Available: '#15803d',
    Closed: '#64748b', Cancelled: '#64748b', Retired: '#64748b', Rejected: '#b91c1c'
  };
  function pill(status) {
    const c = STATUS_COLOR[status] || '#64748b';
    return `<span style="font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 10px;border-radius:999px;background:${c}1a;color:${c}">${status}</span>`;
  }
  function frameShell(inner) {
    return `<div style="font-family:system-ui,sans-serif;padding:24px;color:#1e293b;max-width:760px;margin:0 auto">${inner}</div>`;
  }

  function buildHome() {
    const faqs = state.data.faqs || [];
    return frameShell(`
      <p style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#b45309;font-weight:700;margin-bottom:8px">ICT Service Management</p>
      <h1 style="font-size:30px;margin:0 0 12px">One desk for every request, booking, and ticket.</h1>
      <p style="color:#64748b;line-height:1.6;margin-bottom:24px">Submit ICT support requests, reserve rooms and equipment, and track status end to end.</p>
      ${!state.user ? `<button onclick="parent.loadTab('login')" style="background:#1e293b;color:white;border:none;padding:10px 20px;border-radius:999px;font-weight:600;cursor:pointer">Sign in</button>` : ''}
    `);
  }

  function buildAuth() {
    if (state.error) {
      // rendered after form submit failures; kept out of the shell's cache path
    }
    return frameShell(`
      <div style="max-width:340px;margin:40px auto">
        <h2 style="margin:0 0 4px">Welcome back</h2>
        <p style="color:#64748b;font-size:14px;margin:0 0 20px">Sign in to your account</p>
        ${state.error ? `<div style="background:#fef2f2;color:#b91c1c;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:12px">${esc(state.error)}</div>` : ''}
        <form onsubmit="parent.handleLogin(event)">
          <input required name="email" type="email" placeholder="Email" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:8px">
          <input required name="password" type="password" placeholder="Password" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px">
          <button style="width:100%;background:#1e293b;color:white;border:none;padding:10px;border-radius:8px;font-weight:600;cursor:pointer">Sign in</button>
        </form>
      </div>
    `);
  }

  function buildHelp() {
    const isAdmin = state.user?.role === 'Admin';
    const faqs = state.data.faqs || [];
    return frameShell(`
      ${isAdmin ? `
      <div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:20px">
        <h3 style="margin:0 0 10px">Add FAQ</h3>
        <form onsubmit="parent.handleForm(event,'faqs','help')">
          <input required name="question" placeholder="Question" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
          <textarea required name="answer" placeholder="Answer" rows="2" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px"></textarea>
          <button style="background:#1e293b;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer">Publish</button>
        </form>
      </div>` : ''}
      <h3 style="margin:0 0 12px">Frequently asked</h3>
      ${faqs.length ? faqs.map(f => `
        <div style="border-bottom:1px solid #f1f5f9;padding:10px 0">
          <div style="font-weight:600;font-size:14px">${esc(f.question)}</div>
          <div style="color:#64748b;font-size:14px;margin-top:4px">${esc(f.answer)}</div>
          ${isAdmin ? `<button onclick="parent.deleteRecord('faqs',${f.id},'help')" style="border:none;background:none;color:#b91c1c;font-size:12px;cursor:pointer;margin-top:4px;text-decoration:underline">Delete</button>` : ''}
        </div>`).join('') : `<p style="color:#94a3b8;font-size:14px">No FAQs yet.</p>`}
    `);
  }

  function buildTickets() {
    const tickets = state.data.tickets || [];
    const nextMap = { Pending: 'Assigned', Assigned: 'In Progress', 'In Progress': 'Resolved', Resolved: 'Closed' };
    return frameShell(`
      <div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:20px">
        <h3 style="margin:0 0 10px">New support request</h3>
        <form onsubmit="parent.handleForm(event,'tickets','tickets')">
          <input required name="category" placeholder="Category" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
          <textarea required name="description" placeholder="Describe the issue" rows="2" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px"></textarea>
          <select name="priority" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
            <option value="Normal">Normal</option><option value="Low">Low</option><option value="High">High</option><option value="Urgent">Urgent</option>
          </select>
          <button style="background:#1e293b;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer">Submit</button>
        </form>
      </div>
      ${tickets.map(t => `
        <div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div style="font-weight:600;font-size:14px">${esc(t.category)}</div>${pill(t.status)}
          </div>
          <p style="color:#64748b;font-size:13px;margin:6px 0">${esc(t.description)}</p>
          <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">#${t.id} · ${t.priority} priority${t.assignee_name ? ' · assigned to ' + esc(t.assignee_name) : ''}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${t.status === 'Pending' ? `<button onclick="parent.ticketAction(${t.id},'assign')" style="border:1px solid #cbd5e1;background:none;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer">Assign to me</button>` : ''}
            ${nextMap[t.status] ? `<button onclick="parent.ticketAction(${t.id},'status','${nextMap[t.status]}')" style="border:none;background:#15803d;color:white;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer">Move to ${nextMap[t.status]}</button>` : ''}
          </div>
        </div>`).join('') || `<p style="color:#94a3b8;font-size:14px">No requests yet.</p>`}
    `);
  }

  function buildBookings() {
    const bookings = state.data.bookings || [];
    const items = (state.data.items || []).filter(i => i.status === 'Available');
    return frameShell(`
      <div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:20px">
        <h3 style="margin:0 0 10px">Book equipment or a room</h3>
        <form onsubmit="parent.handleBooking(event)">
          <select required name="item_id" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
            <option value="">Select item…</option>
            ${items.map(i => `<option value="${i.id}">${esc(i.name)} (${i.type})</option>`).join('')}
          </select>
          <div style="display:flex;gap:8px;margin-bottom:6px">
            <input required name="start_time" type="datetime-local" style="flex:1;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px">
            <input required name="end_time" type="datetime-local" style="flex:1;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px">
          </div>
          <button style="background:#1e293b;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer">Request</button>
        </form>
      </div>
      ${bookings.map(b => `
        <div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:start">
            <div style="font-weight:600;font-size:14px">${esc(b.item_name || 'Item #' + b.item_id)}</div>${pill(b.status)}
          </div>
          <div style="font-size:12px;color:#94a3b8;margin:6px 0">${fmtDate(b.start_time)} → ${fmtDate(b.end_time)}</div>
          <div style="display:flex;gap:8px">
            ${b.status === 'Pending' ? `
              <button onclick="parent.bookingAction(${b.id},'approve')" style="border:none;background:#15803d;color:white;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer">Approve</button>
              <button onclick="parent.bookingAction(${b.id},'reject')" style="border:1px solid #b91c1c;color:#b91c1c;background:none;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer">Reject</button>` : ''}
            ${['Pending', 'Approved'].includes(b.status) ? `<button onclick="parent.bookingAction(${b.id},'cancel')" style="border:none;background:none;color:#94a3b8;font-size:12px;cursor:pointer;text-decoration:underline">Cancel</button>` : ''}
          </div>
        </div>`).join('') || `<p style="color:#94a3b8;font-size:14px">No bookings yet.</p>`}
    `);
  }

  function buildEquipment() {
    const isAdmin = state.user?.role === 'Admin';
    const items = state.data.items || [];
    return frameShell(`
      ${isAdmin ? `
      <div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:20px">
        <h3 style="margin:0 0 10px">Add item</h3>
        <form onsubmit="parent.handleForm(event,'items','equipment')">
          <input required name="name" placeholder="Name" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
          <select required name="type" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
            <option value="Equipment">Equipment</option><option value="Room">Room</option>
          </select>
          <button style="background:#1e293b;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer">Add</button>
        </form>
      </div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        ${items.map(i => `
          <div style="border:1px solid #e2e8f0;border-radius:12px;padding:12px">
            <div style="display:flex;justify-content:space-between"><div style="font-weight:600;font-size:14px">${esc(i.name)}</div><span style="font-size:11px;color:#94a3b8">${i.type}</span></div>
            <div style="margin-top:8px">${isAdmin ? `
              <select onchange="parent.itemStatus(${i.id},this.value)" style="font-size:12px;border:1px solid #e2e8f0;border-radius:999px;padding:2px 8px">
                ${['Available', 'Maintenance', 'Retired'].map(s => `<option ${s === i.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>` : pill(i.status)}</div>
          </div>`).join('') || `<p style="color:#94a3b8;font-size:14px">No items yet.</p>`}
      </div>
    `);
  }

  function buildAnnouncements() {
    const isAdmin = state.user?.role === 'Admin';
    const list = state.data.announcements || [];
    return frameShell(`
      ${isAdmin ? `
      <div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:20px">
        <h3 style="margin:0 0 10px">Publish announcement</h3>
        <form onsubmit="parent.handleForm(event,'announcements','announcements')">
          <input required name="title" placeholder="Title" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px">
          <textarea required name="body" placeholder="Message" rows="2" style="width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:6px"></textarea>
          <button style="background:#1e293b;color:white;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer">Publish</button>
        </form>
      </div>` : ''}
      ${list.map(a => `
        <div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px">
          <div style="font-weight:600;font-size:14px">${esc(a.title)}</div>
          <p style="color:#64748b;font-size:13px;margin:4px 0">${esc(a.body)}</p>
          <div style="font-size:11px;color:#94a3b8">${fmtDate(a.created_at)}</div>
        </div>`).join('') || `<p style="color:#94a3b8;font-size:14px">No announcements yet.</p>`}
    `);
  }

  function buildAdmin() {
    const s = state.data.stats || {};
    const users = state.data.users || [];
    return frameShell(`
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px">
        ${[['total_users', 'Users'], ['total_tickets', 'Tickets'], ['total_bookings', 'Bookings']].map(([k, label]) => `
        <div style="border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center">
          <div style="font-size:22px;font-weight:700">${s[k] ?? '—'}</div><div style="font-size:11px;color:#94a3b8">${label}</div>
        </div>`).join('')}
      </div>
      <h3 style="margin:0 0 10px">Users</h3>
      ${users.map(u => `
        <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:6px">
          <div><div style="font-weight:600;font-size:13px">${esc(u.name)}</div><div style="font-size:11px;color:#94a3b8">${esc(u.email)}</div></div>
          <select onchange="parent.userRole(${u.id},this.value)" style="font-size:12px;border:1px solid #e2e8f0;border-radius:999px;padding:2px 8px">
            ${['User', 'Staff', 'Admin'].map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}
          </select>
        </div>`).join('')}
    `);
  }

  // ============================================
  // NOTIFICATIONS (bell → full sheet, not sub sheet)
  // ============================================
  async function openNotifications() {
    try {
      state.data.notifications = await api('/notifications');
      openFullSheet('Notifications', buildNotifications());
      useState('data', state.data);
    } catch (err) { useState('error', err.message); }
  }
  function buildNotifications() {
    const list = state.data.notifications || [];
    return frameShell(list.map(n => `
      <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:8px;${n.is_read ? 'opacity:.5' : ''}">
        <span style="font-size:13px">${esc(n.message)}</span>
        ${!n.is_read ? `<button onclick="parent.readNotification(${n.id})" style="border:none;background:none;color:#b45309;font-size:12px;cursor:pointer;text-decoration:underline">Mark read</button>` : ''}
      </div>`).join('') || `<p style="color:#94a3b8;font-size:14px">No notifications yet.</p>`);
  }
  async function readNotification(id) {
    try { await api(`/notifications/${id}/read`, { method: 'PATCH' }); await openNotifications(); } catch (_) {}
  }

  // ============================================
  // RENDER — the only place that mutates the outer DOM
  // ============================================
  function applyFrame(frameId, html) {
    const frame = document.getElementById(frameId);
    frame.removeAttribute('src');
    frame.srcdoc = html;
  }

  function render() {
    const active = SECTIONS[state.activeTab];
    document.getElementById('pageTitle').textContent = active ? active.label : 'Select a section';
    document.getElementById('pageInfo').textContent = state.pageInfo;
    document.getElementById('menu').classList.toggle('open', state.isMenuOpen);
    document.getElementById('bellDot').classList.toggle('hidden', !(state.data.notifications || []).some(n => !n.is_read));

    const full = document.getElementById('fullSheet');
    full.classList.toggle('hidden', !state.fullSheet.active);
    document.getElementById('fullSheetTitle').textContent = state.fullSheet.title || '';
    if (state.fullSheet.active) applyFrame('fullFrame', state.fullSheet.content);

    renderMenu();
  }

  function renderMenu() {
    const list = document.getElementById('menuList');
    list.innerHTML = visibleTabs().map(([id, s]) => `
      <button data-tab="${id}"
        style="width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px;border:none;cursor:pointer;display:flex;align-items:center;gap:10px;
               background:${state.activeTab === id ? '#2563eb' : 'transparent'};color:${state.activeTab === id ? 'white' : '#e2e8f0'}">
        <i class="fa ${s.icon}"></i>${s.label}
      </button>`).join('');
    list.querySelectorAll('[data-tab]').forEach(btn => { btn.onclick = () => loadTab(btn.dataset.tab); });

    document.getElementById('userBox').innerHTML = state.user
      ? `${esc(state.user.name)} · ${state.user.role}<br><button onclick="parent.logout()" style="color:#f87171;background:none;border:none;font-size:11px;cursor:pointer;margin-top:4px;text-decoration:underline">Sign out</button>`
      : `Not signed in`;
  }

  function openFullSheet(title, content) { useState('fullSheet', { active: true, title, content }); }
  function closeFullSheet() { useState('fullSheet', { active: false, title: '', content: null }); }

  // ============================================
  // ACTIONS — only these call useState / api; forms live inside iframes
  // and reach back out through window.parent.
  // ============================================
  async function handleLogin(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: f.get('email'), password: f.get('password') }) });
      loginSuccess(data.token, data.user);
      loadTab('home');
    } catch (err) { useState('error', err.message); applyFrame('mainFrame', buildAuth()); }
  }

  async function handleForm(e, endpointKey, refreshTab) {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    try { await api(ENDPOINT_PATH[endpointKey], { method: 'POST', body: JSON.stringify(body) }); await loadTab(refreshTab, true); }
    catch (err) { useState('error', err.message); }
  }
  async function handleBooking(e) {
    e.preventDefault();
    const body = Object.fromEntries(new FormData(e.target));
    body.start_time = new Date(body.start_time).toISOString();
    body.end_time = new Date(body.end_time).toISOString();
    try { await api('/bookings', { method: 'POST', body: JSON.stringify(body) }); await loadTab('bookings', true); }
    catch (err) { useState('error', err.message); }
  }
  async function deleteRecord(endpointKey, id, refreshTab) {
    try { await api(`${ENDPOINT_PATH[endpointKey]}/${id}`, { method: 'DELETE' }); await loadTab(refreshTab, true); }
    catch (err) { useState('error', err.message); }
  }
  async function ticketAction(id, kind, status) {
    try {
      if (kind === 'assign') await api(`/tickets/${id}/assign`, { method: 'PATCH', body: JSON.stringify({ assigned_to: state.user.id }) });
      else await api(`/tickets/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status }) });
      await loadTab('tickets', true);
    } catch (err) { useState('error', err.message); }
  }
  async function bookingAction(id, action) {
    try { await api(`/bookings/${id}/${action}`, { method: 'PATCH' }); await loadTab('bookings', true); }
    catch (err) { useState('error', err.message); }
  }
  async function itemStatus(id, status) {
    try { await api(`/items/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) }); await loadTab('equipment', true); }
    catch (err) { useState('error', err.message); }
  }
  async function userRole(id, role) {
    try { await api(`/admin/users/${id}/role`, { method: 'PATCH', body: JSON.stringify({ role }) }); await loadTab('admin', true); }
    catch (err) { useState('error', err.message); }
  }

  // ============================================
  // EVENTS + INIT
  // ============================================
  function bindEvents() {
    document.getElementById('openMenuBtn').onclick = () => useState('isMenuOpen', true);
    document.getElementById('closeMenuBtn').onclick = () => useState('isMenuOpen', false);
    document.getElementById('refreshBtn')?.addEventListener('click', refreshActive);
    document.getElementById('closeFullSheetBtn').onclick = closeFullSheet;
    document.getElementById('bellBtn').onclick = openNotifications;

    document.addEventListener('click', e => {
      const menu = document.getElementById('menu');
      const btn = document.getElementById('openMenuBtn');
      if (state.isMenuOpen && !menu.contains(e.target) && !btn.contains(e.target)) useState('isMenuOpen', false);
    });
  }

  function init() {
    bindEvents();
    loadTab(state.user ? 'home' : 'home');
  }

  document.addEventListener('DOMContentLoaded', init);

  // exposed so content rendered inside iframes can call back via window.parent
  window.loadTab = loadTab;
  window.handleLogin = handleLogin;
  window.handleForm = handleForm;
  window.handleBooking = handleBooking;
  window.deleteRecord = deleteRecord;
  window.ticketAction = ticketAction;
  window.bookingAction = bookingAction;
  window.itemStatus = itemStatus;
  window.userRole = userRole;
  window.readNotification = readNotification;
  window.logout = logout;
</script>
</body>
</html>
